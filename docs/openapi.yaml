openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact book
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    This is a documentation of contact book app
tags:
  # теги, що ви будете використовувати
  - name: Contacts
    description : Operations about contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://nodejs-hw-mongodb-13-tos8.onrender.com
    description: Production server on Render
paths:
  # тут будуть посилання на ендпоінти
  /contacts:
    get: 
      $ref: ../swagger/paths/contacts/get.yaml
    post: 
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml 
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh.yaml
  /auth/request-reset-email:
    post:
      $ref: ../swagger/paths/auth/request-reset-email.yaml
  /auth/reset-password:
    post:
      $ref: ../swagger/paths/auth/reset-password.yaml    
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
