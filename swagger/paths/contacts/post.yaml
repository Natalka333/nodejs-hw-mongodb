#/swagger/paths/contacts/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - _id
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          _id:        
            description: "Contact's id"
            type: string
            example: 66fc0886a718170456efe580
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: number
            example: 380999678900
          email:
            description: "Contact's email"
            type: string
            example: alice555@example.com
          isFavourite:
            description: "Contact is favorite or no"
            type: boolean
            example: false
          contactType:
            description: 'What type of contact'
            type: string
            enum: ['work', 'home', 'personal']
            example: home
          userId:
            description: "Contact's user id"
            type: string
            example: 672799a1ea1e0ee61f8cac29
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'

