
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Register a new user with the provided information.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: 'Alice Doe'
            email:
              type: string
              example: 'alice555@example.com'
            password:
              type: string
              example: 'qweqwe123'
  responses:
    '201':
      description: Successfully registered a user
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            - message
            - data
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully registered a user!
              data:
                type: object
                properties:
                  id:
                    type: string
                    example: '60fc0886a718170456efe580'
    '400':
      $ref: '../../components/responses/400.yaml'
