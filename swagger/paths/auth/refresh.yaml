post:
  tags:
    - Auth
  summary: Refresh user session
  operationId: refreshUserSession
  description: Refresh the user session and update the access token.
  responses:
    '200':
      description: Successfully refreshed a session
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully refreshed a session!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR...'
    '401':
      $ref: '../../components/responses/401.yaml'