post:
  tags:
    - Auth
  summary: User login
  operationId: loginUser
  description: Login a user and set session cookies.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              example: 'alice555@example.com'
            password:
              type: string
              example: 'qweqwe123'
  responses:
    '200':
      description: Successfully logged in a user
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully logged in a user!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR...'
  '401':
    $ref: '../../components/responses/401.yaml'
